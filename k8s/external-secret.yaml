# Cómo un manifest referencia un secreto de AWS Secrets Manager (AWS Academy Learner Lab):
# External Secrets Operator (lo instala scripts/eks_up.sh) lee el secreto usando las credenciales de su
# entorno, que en Learner Lab son las de LabRole, el rol de los nodos, vía IMDS. Lo copia al Secret
# "rds-credentials" y ticket-api y ticket-worker lo reciben como variables de entorno con secretKeyRef.
#
# (Con IRSA o Pod Identity se usaría un rol por pod, pero Learner Lab no permite crear roles IAM.)
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: aws-secretsmanager
  namespace: concertpass
spec:
  provider:
    aws:
      service: SecretsManager
      region: "__AWS_REGION__"
      # sin bloque auth: el SDK usa su cadena de credenciales por defecto -> rol del nodo (LabRole)
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rds-credentials
  namespace: concertpass
spec:
  refreshInterval: 1h            # si se rota la contraseña en Secrets Manager, el Secret se actualiza
  secretStoreRef:
    name: aws-secretsmanager
    kind: SecretStore
  target:
    name: rds-credentials        # Secret de Kubernetes que se crea
    creationPolicy: Owner
  data:                          # cada llave del JSON de Secrets Manager -> una variable DB_*
    - secretKey: DB_HOST
      remoteRef: { key: "__DB_SECRET_NAME__", property: host }
    - secretKey: DB_PORT
      remoteRef: { key: "__DB_SECRET_NAME__", property: port }
    - secretKey: DB_NAME
      remoteRef: { key: "__DB_SECRET_NAME__", property: dbname }
    - secretKey: DB_USER
      remoteRef: { key: "__DB_SECRET_NAME__", property: username }
    - secretKey: DB_PASSWORD
      remoteRef: { key: "__DB_SECRET_NAME__", property: password }
