apiVersion: apps/v1
kind: Deployment
metadata:
  name: ticket-checkout
  namespace: concertpass
  labels:
    app: ticket-checkout
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ticket-checkout
  template:
    metadata:
      labels:
        app: ticket-checkout
    spec:
      containers:
        - name: ticket-checkout
          image: __ECR_REGISTRY__/ticket-checkout:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet: { path: /health, port: 8080 }
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 8080 }
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 250m, memory: 128Mi }
